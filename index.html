<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docket</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --paper:#F1ECE0;
  --paper-raised:#F8F4E9;
  --ink:#20261F;
  --ink-soft:#5B5C4F;
  --rule:#C9C0AC;
  --oxblood:#7A2E2E;
  --sage:#5C6B54;
  --ochre:#A9803D;
  --slate:#41544E;
  --clay:#8A6A52;
}

*{box-sizing:border-box;}

body{
  margin:0;
  background:var(--paper);
  background-image:repeating-linear-gradient(0deg, rgba(0,0,0,0.015) 0px, rgba(0,0,0,0.015) 1px, transparent 1px, transparent 3px);
  color:var(--ink);
  font-family:'Source Serif 4', Georgia, serif;
  min-height:100vh;
}

.wrap{max-width:820px; margin:0 auto; padding:48px 24px 100px;}

header{
  border-bottom:2px solid var(--ink);
  padding-bottom:18px;
  margin-bottom:8px;
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  flex-wrap:wrap;
  gap:8px;
}
h1{font-size:2.1rem; font-weight:700; margin:0; letter-spacing:-0.01em;}
.tagline{
  font-family:'IBM Plex Mono', monospace;
  font-size:0.72rem;
  text-transform:uppercase;
  letter-spacing:0.08em;
  color:var(--ink-soft);
}
.meta-row{
  font-family:'IBM Plex Mono', monospace;
  font-size:0.7rem;
  color:var(--ink-soft);
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:8px;
  margin:6px 0 24px;
}

.filters{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-bottom:28px;
  padding-bottom:20px;
  border-bottom:1px solid var(--rule);
}
.filter-pill{
  font-family:'IBM Plex Mono', monospace;
  font-size:0.68rem;
  text-transform:uppercase;
  letter-spacing:0.05em;
  padding:5px 11px;
  border:1px solid var(--rule);
  background:none;
  color:var(--ink-soft);
  cursor:pointer;
  border-radius:2px;
}
.filter-pill:hover{border-color:var(--ink); color:var(--ink);}
.filter-pill.active{background:var(--ink); color:var(--paper-raised); border-color:var(--ink);}

.stage-head{
  font-family:'IBM Plex Mono', monospace;
  font-size:0.7rem;
  text-transform:uppercase;
  letter-spacing:0.09em;
  color:var(--ink-soft);
  margin:34px 0 12px;
  padding-bottom:6px;
  border-bottom:1px solid var(--rule);
  display:flex;
  justify-content:space-between;
}
.stage-head:first-of-type{margin-top:0;}

.card{
  background:var(--paper-raised);
  border:1px solid var(--rule);
  border-left:5px solid var(--ink);
  padding:18px 20px 15px;
  margin-bottom:14px;
  box-shadow:0 1px 0 rgba(0,0,0,0.03);
}
.card.s-published{border-left-color:var(--ink-soft);}
.card.s-conditional{border-left-color:var(--sage);}
.card.s-review{border-left-color:var(--slate);}
.card.s-revise{border-left-color:var(--oxblood);}
.card.s-ready{border-left-color:var(--ochre);}
.card.s-drafting{border-left-color:var(--ochre);}
.card.s-prep{border-left-color:var(--clay);}
.card.s-idea{border-left-color:var(--rule);}
.card.pri{box-shadow:inset 3px 0 0 rgba(0,0,0,0.06), 0 1px 0 rgba(0,0,0,0.03);}

.card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:14px;}
.title-block{flex:1; min-width:0;}
.title{font-size:1.12rem; font-weight:600; margin:0 0 4px; line-height:1.3;}
.subline{
  font-family:'IBM Plex Mono', monospace;
  font-size:0.68rem;
  color:var(--ink-soft);
  text-transform:uppercase;
  letter-spacing:0.04em;
  display:flex;
  flex-wrap:wrap;
  gap:4px 10px;
}
.pri-tag{color:var(--oxblood); font-weight:500;}

.stamp{
  font-family:'IBM Plex Mono', monospace;
  font-size:0.63rem;
  font-weight:500;
  text-transform:uppercase;
  letter-spacing:0.06em;
  padding:4px 9px;
  border:1.5px solid currentColor;
  border-radius:2px;
  transform:rotate(-2deg);
  white-space:nowrap;
  flex-shrink:0;
}
.stamp.s-published{color:var(--ink-soft); opacity:0.65;}
.stamp.s-conditional{color:var(--sage);}
.stamp.s-review{color:var(--slate);}
.stamp.s-revise{color:var(--oxblood);}
.stamp.s-ready{color:var(--ochre);}
.stamp.s-drafting{color:var(--ochre);}
.stamp.s-prep{color:var(--clay);}
.stamp.s-idea{color:var(--rule);}

.state{font-size:0.9rem; line-height:1.5; margin:11px 0 0; color:var(--ink);}
.state:empty{display:none;}
.notes{font-size:0.88rem; line-height:1.5; margin:7px 0 0; color:var(--ink-soft);}
.notes:empty{display:none;}
.journals{
  font-family:'IBM Plex Mono', monospace;
  font-size:0.66rem;
  color:var(--ink-soft);
  margin:9px 0 0;
  letter-spacing:0.02em;
}
.journals:empty{display:none;}

.card-bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  border-top:1px solid var(--rule);
  padding-top:9px;
  margin-top:11px;
}
a.file-link{
  font-family:'IBM Plex Mono', monospace;
  font-size:0.72rem;
  color:var(--slate);
  text-decoration:none;
  border-bottom:1px solid var(--slate);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
a.file-link:hover{color:var(--oxblood); border-color:var(--oxblood);}
.no-link{font-family:'IBM Plex Mono', monospace; font-size:0.72rem; color:var(--rule);}

.card-actions{display:flex; gap:11px; flex-shrink:0;}
.icon-btn{
  font-family:'IBM Plex Mono', monospace;
  font-size:0.68rem;
  color:var(--ink-soft);
  background:none;
  border:none;
  cursor:pointer;
  padding:2px 3px;
  text-transform:uppercase;
  letter-spacing:0.04em;
}
.icon-btn:hover{color:var(--ink); text-decoration:underline;}
.icon-btn.danger:hover{color:var(--oxblood);}
.icon-btn.on{color:var(--oxblood);}

.field{margin-bottom:11px;}
.field label{
  display:block;
  font-family:'IBM Plex Mono', monospace;
  font-size:0.63rem;
  text-transform:uppercase;
  letter-spacing:0.06em;
  color:var(--ink-soft);
  margin-bottom:4px;
}
.field input, .field select, .field textarea{
  width:100%;
  font-family:'Source Serif 4', Georgia, serif;
  font-size:0.92rem;
  padding:7px 9px;
  border:1px solid var(--rule);
  background:#fff;
  color:var(--ink);
  border-radius:2px;
}
.field textarea{resize:vertical; min-height:52px; font-family:'Source Serif 4', Georgia, serif;}
.field-row{display:flex; gap:11px; flex-wrap:wrap;}
.field-row .field{flex:1; min-width:180px;}
.check-row{
  display:flex; align-items:center; gap:7px;
  font-family:'IBM Plex Mono', monospace;
  font-size:0.68rem;
  text-transform:uppercase;
  letter-spacing:0.05em;
  color:var(--ink-soft);
  margin-bottom:11px;
}
.check-row input{width:auto;}

.form-actions{display:flex; gap:9px; margin-top:13px;}
.btn{
  font-family:'IBM Plex Mono', monospace;
  font-size:0.7rem;
  text-transform:uppercase;
  letter-spacing:0.05em;
  padding:8px 15px;
  border:1.5px solid var(--ink);
  background:var(--ink);
  color:var(--paper-raised);
  cursor:pointer;
  border-radius:2px;
}
.btn.ghost{background:none; color:var(--ink); border-color:var(--rule);}
.btn:hover{opacity:0.85;}

.add-toggle{
  width:100%;
  text-align:left;
  background:none;
  border:1px dashed var(--rule);
  padding:13px 15px;
  font-family:'IBM Plex Mono', monospace;
  font-size:0.75rem;
  text-transform:uppercase;
  letter-spacing:0.05em;
  color:var(--ink-soft);
  cursor:pointer;
  margin-top:26px;
}
.add-toggle:hover{border-color:var(--ink); color:var(--ink);}

.empty, .loading{
  text-align:center;
  padding:50px 20px;
  color:var(--ink-soft);
  font-family:'IBM Plex Mono', monospace;
  font-size:0.76rem;
  letter-spacing:0.04em;
}

.reset-row{text-align:center; margin-top:36px;}
.reset-row button{
  background:none; border:none;
  font-family:'IBM Plex Mono', monospace;
  font-size:0.63rem;
  color:var(--rule);
  text-transform:uppercase;
  letter-spacing:0.05em;
  cursor:pointer;
}
.reset-row button:hover{color:var(--oxblood);}

.sync-btn{
  font-family:'IBM Plex Mono', monospace;
  font-size:0.68rem;
  text-transform:uppercase;
  letter-spacing:0.04em;
  color:var(--slate);
  background:none; border:none; cursor:pointer; padding:0;
  text-decoration:underline;
}
.sync-btn:hover{color:var(--oxblood);}
.sync-status{display:flex; align-items:center; gap:9px;}
.sync-dot{width:7px; height:7px; border-radius:50%; background:var(--rule); display:inline-block;}
.sync-dot.on{background:var(--sage);}
.sync-dot.err{background:var(--oxblood);}

.sync-panel{
  background:var(--paper-raised);
  border:1px solid var(--rule);
  border-left:5px solid var(--slate);
  padding:19px 21px;
  margin-bottom:18px;
}
.sync-panel h2{font-size:1rem; margin:0 0 6px;}
.sync-panel p{font-size:0.85rem; line-height:1.55; color:var(--ink-soft); margin:0 0 13px;}
.sync-panel p.small{font-size:0.75rem;}
.sync-panel a{color:var(--slate);}
.sync-msg{
  font-family:'IBM Plex Mono', monospace;
  font-size:0.7rem;
  padding:8px 10px;
  margin-bottom:13px;
  border:1px solid var(--rule);
}
.sync-msg.err{color:var(--oxblood); border-color:var(--oxblood);}
.sync-msg.ok{color:var(--sage); border-color:var(--sage);}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading">Opening the docket…</div>
</div>

<script>
const STATUS_META = {
  'conditional': {label:'Conditional accept', cls:'s-conditional', stage:'Under review'},
  'under-review':{label:'Under review',       cls:'s-review',      stage:'Under review'},
  'ready':       {label:'Ready to send',      cls:'s-ready',       stage:'Ready to send'},
  'revise':      {label:'Revision needed',    cls:'s-revise',      stage:'Revision needed'},
  'drafting':    {label:'Drafting',           cls:'s-drafting',    stage:'In preparation'},
  'prep':        {label:'In preparation',     cls:'s-prep',        stage:'In preparation'},
  'idea':        {label:'Idea',               cls:'s-idea',        stage:'Ideas'},
  'published':   {label:'Published',          cls:'s-published',   stage:'Published'},
};
const STAGE_ORDER = ['Under review','Ready to send','Revision needed','In preparation','Ideas','Published'];

const STORAGE_KEY = 'docket:projects';
const SYNC_KEY = 'docket:sync-config';
const GIST_FILENAME = 'docket.json';
let projects = [];
let editingId = null;
let addingNew = false;
let showSyncPanel = false;
let syncState = 'off';
let syncMessage = '';
let syncBusy = false;
let activeFilter = 'all';

function getSyncConfig(){
  try{ const raw = localStorage.getItem(SYNC_KEY); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
function setSyncConfig(cfg){
  if(cfg) localStorage.setItem(SYNC_KEY, JSON.stringify(cfg));
  else localStorage.removeItem(SYNC_KEY);
}

async function ghRequest(url, options={}){
  const cfg = getSyncConfig();
  const res = await fetch(url, {
    ...options,
    headers:{
      'Authorization': `Bearer ${cfg.token}`,
      'Accept': 'application/vnd.github+json',
      ...(options.headers || {})
    }
  });
  if(!res.ok){
    const body = await res.text().catch(() => '');
    throw new Error(`GitHub API ${res.status}: ${res.statusText}${body ? ' — ' + body.slice(0,200) : ''}`);
  }
  return res.json();
}

async function connectSync(token, gistId){
  syncBusy = true; syncMessage = ''; showSyncPanel = true; render();
  try{
    setSyncConfig({token, gistId: gistId || null});
    if(gistId){
      const gist = await ghRequest(`https://api.github.com/gists/${gistId}`);
      const file = gist.files && gist.files[GIST_FILENAME];
      if(!file) throw new Error(`Gist found, but has no ${GIST_FILENAME} file.`);
      projects = JSON.parse(file.content);
      await saveProjects();
    } else {
      const gist = await ghRequest('https://api.github.com/gists', {
        method:'POST',
        body: JSON.stringify({
          description:'Docket — writing project tracker data',
          public:false,
          files:{ [GIST_FILENAME]: { content: JSON.stringify(projects, null, 2) } }
        })
      });
      setSyncConfig({token, gistId: gist.id});
    }
    syncState = 'ok'; syncMessage = 'Connected. Synced just now.';
  }catch(e){
    syncState = 'err'; syncMessage = e.message || 'Could not connect.';
    setSyncConfig(null);
  }
  syncBusy = false; render();
}

function disconnectSync(){ setSyncConfig(null); syncState='off'; syncMessage=''; render(); }

async function syncPull(){
  const cfg = getSyncConfig();
  if(!cfg || !cfg.gistId) return;
  syncBusy = true; render();
  try{
    const gist = await ghRequest(`https://api.github.com/gists/${cfg.gistId}`);
    const file = gist.files && gist.files[GIST_FILENAME];
    if(file){ projects = JSON.parse(file.content); await saveProjects(false); }
    syncState='ok'; syncMessage='Synced just now.';
  }catch(e){ syncState='err'; syncMessage=e.message || 'Sync failed.'; }
  syncBusy = false; render();
}

async function syncPush(){
  const cfg = getSyncConfig();
  if(!cfg || !cfg.gistId) return;
  try{
    await ghRequest(`https://api.github.com/gists/${cfg.gistId}`, {
      method:'PATCH',
      body: JSON.stringify({ files:{ [GIST_FILENAME]: { content: JSON.stringify(projects, null, 2) } } })
    });
    syncState='ok'; syncMessage='Synced just now.';
  }catch(e){ syncState='err'; syncMessage=e.message || 'Sync failed — saved locally only.'; }
}

function mk(title, collaborators, status, state, notes, journals, type, priority){
  return {
    id: crypto.randomUUID(),
    title, collaborators: collaborators || 'Solo', status,
    state: state || '', notes: notes || '', journals: journals || '',
    type: type || '', link:'', priority: !!priority,
    updated: new Date().toISOString()
  };
}

const seed = () => ([
  mk('Redeeming Scientific Deliberation','Eamon Duede','revise','Beef up','Get to 6500/7000 words, then send to Mind.','Analysis','Standalone (co-authored)',true),
  mk('Normative Defeat','Solo','under-review','Edit','','JPhil, Nous','Standalone',true),
  mk('End of (Shared) Action','Solo','revise','Write up!!!','','','',true),
  mk('Control and Understanding','Eamon Duede','drafting','Not yet drafted','New project, not on the status sheet.','','Standalone (co-authored)',true),
  mk('Paper with Somogy','Somogy','drafting','Not yet drafted','New project, not on the status sheet.','','Co-authored',true),
  mk('Paper with Will & Dunja','Will Fleisher, Dunja Šešelja','prep','About to discuss','New project, distinct from Fact-Checking and Zetetic Encroachment.','','Co-authored',true),

  mk('High Impact Evidence','Solo','conditional','Conditional acceptance at Journal of Philosophy (7/9/26)','Wait.','Nous','Standalone'),
  mk('Two Kinds of Error in Shared Inquiry','Solo','under-review','Under review at Erkenntnis (7/7/26)','Wait.','Phil Review, Nous, JPhil, PPR, Phil Studies, Phil Imprint, AJP, Synthese, Mind, Episteme, Ergo, Phil Quarterly','Dissertation chapter'),
  mk('Embracing HAL: Artificial Joint Inquiry','Solo','under-review','Under review at Synthese (6/22/26)','Wait.','Philosophical Studies, Phil Imprint','Standalone'),
  mk('Discovery Paper','Eamon Duede','under-review','Under review at Phil Studies (6/29/26)','Wait.','BJPS, PPR, Imprint, Ergo','Standalone (co-authored)'),
  mk('Goldilocks','Eamon Duede','ready','Send to PPR August 15','','BJPS','Standalone (co-authored)'),
  mk('Interpretability Needs Behavior','Eamon Duede','ready','Waiting for Eamon','Wait for Eamon read-through, then ship to Phil Studies.','','Standalone (co-authored)'),
  mk('Why Share Inquiry','Solo','drafting','Draft available','Waiting for feedback from Beri and Krista.','','Standalone'),

  mk('Costs of Collaboration','Solo','revise','Revise based on notes','','','Standalone'),
  mk('Scaling Up Shared Inquiry','Solo','revise','In progress','Use notes from seminar and JPhil comments to revise. Finish drafting.','N/A — maybe reframe the way MB suggests','Dissertation chapter'),
  mk('Against Epistemic Nihilism','Solo','revise','Expand draft to take up broader targets','Restructure into a broader point about the misguided focus of the zetetic norm debate. Read recent Falbo and Dominguez papers, revisit Logins, use those to frame.','Analysis','Standalone'),
  mk('Shared Agency, Internalism, and Continuity','Solo','revise','Revisit whether it warrants its own paper','Numerous JPhil comments to incorporate. See how Scaling Up Shared Inquiry goes, then draft a revision plan. May be misguided as a standalone project.','PPR','Standalone'),

  mk('Reasoning Together','Solo','prep','Draft in preparation','Handout done; feedback to incorporate from Bard Conference.','','Standalone'),
  mk('Fact-Checking','Dunja Šešelja, Will Fleisher','prep','Long abstract / slides','','','Standalone (co-authored)'),
  mk('In Defense of Prediction','Solo','prep','Draft with lingering feedback','Feedback from MK still to be incorporated.','','Standalone'),
  mk('Epistemic Solidarity','Solo','prep','Draft in preparation','','','Standalone'),
  mk('Zetetic Reasoning','Solo','prep','Handout, with comments from SWAG','','','Standalone'),
  mk('How to Build an Epistemic Community','Solo','prep','In draft mode','Born from a full draft with Esoteric Epistemology. Think about whether better apart or together — maybe frame as criticism of the social instrumentalist turn. Could spin the AI challenge off into its own paper.','','Standalone'),
  mk('Esoteric Epistemology','Solo','prep','Material for a full draft','Conjoined with How to Build an Epistemic Community. Same open question about splitting or merging.','','Standalone'),
  mk('Shared Inquiry and Deliberative Democracy','Solo','prep','Abstract','Draft handout; frame with respect to the Hannon and Egler papers.','','Standalone'),

  mk('Zetetic Encroachment','Dunja Šešelja, Will Fleisher','idea','See Remarkable doc','','','Co-authored'),
  mk('Trust paper','Adam Carter (?)','idea','See Remarkable doc','','','Co-authored'),
  mk('Anti-reductionism without trust','Solo','idea','See Remarkable doc','','',''),
  mk('Morally Complex Shared Inquiry','Solo','idea','See Remarkable doc','','',''),

  mk('Zetetic Rights and Wrong(ing)s','Solo','published','Published at Philosophical Quarterly','','Phil Quarterly','Standalone'),
  mk('Intentions and Inquiry','Solo','published','Published at Mind','','Mind','Dissertation chapter'),
  mk('Scientific Disagreement, Fast Science, and Higher-Order Evidence','Dunja Šešelja','published','Published at Philosophy of Science','','Philosophy of Science','Standalone (co-authored)'),
  mk('Cooperation, Anticipation, and Shared Inquiry','Solo','published','Published at AJP','','Phil Review, Journal of Philosophy, AJP','Dissertation chapter'),
  mk('Expert Judgment: Overlooked Epistemic Reasons','Solo','published','Published in Expert Judgment','','','Edited volume (co-authored)'),
]);

async function loadProjects(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    projects = raw ? JSON.parse(raw) : seed();
    if(!raw) await saveProjects(false);
  }catch(e){ projects = seed(); await saveProjects(false); }

  const cfg = getSyncConfig();
  if(cfg && cfg.gistId){ render(); await syncPull(); return; }
  render();
}

async function saveProjects(pushToGist = true){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(projects)); }
  catch(e){ console.error('Save failed', e); }
  const cfg = getSyncConfig();
  if(pushToGist && cfg && cfg.gistId) await syncPush();
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function statusOptionsHtml(selected){
  return Object.entries(STATUS_META).map(([k,v]) =>
    `<option value="${k}" ${k===selected?'selected':''}>${v.label}</option>`
  ).join('');
}

function cardHtml(p){
  const meta = STATUS_META[p.status] || STATUS_META['prep'];
  const linkHtml = p.link
    ? `<a class="file-link" href="${escapeHtml(p.link)}" target="_blank" rel="noopener">→ ${escapeHtml(p.link.replace(/^https?:\/\//,''))}</a>`
    : `<span class="no-link">No file linked</span>`;
  const sub = [];
  if(p.priority) sub.push(`<span class="pri-tag">◆ Semester</span>`);
  sub.push(escapeHtml(p.collaborators || 'Solo'));
  if(p.type) sub.push(escapeHtml(p.type));
  return `
    <div class="card ${meta.cls}${p.priority?' pri':''}">
      <div class="card-top">
        <div class="title-block">
          <p class="title">${escapeHtml(p.title)}</p>
          <p class="subline">${sub.join('<span>·</span>')}</p>
        </div>
        <span class="stamp ${meta.cls}">${meta.label}</span>
      </div>
      <p class="state">${escapeHtml(p.state)}</p>
      <p class="notes">${escapeHtml(p.notes)}</p>
      <p class="journals">${p.journals ? 'Sent: ' + escapeHtml(p.journals) : ''}</p>
      <div class="card-bottom">
        ${linkHtml}
        <div class="card-actions">
          <button class="icon-btn ${p.priority?'on':''}" onclick="togglePriority('${p.id}')">${p.priority?'Unflag':'Flag'}</button>
          <button class="icon-btn" onclick="startEdit('${p.id}')">Edit</button>
          <button class="icon-btn danger" onclick="deleteProject('${p.id}')">Remove</button>
        </div>
      </div>
    </div>
  `;
}

function editFormHtml(p){
  const isNew = !p.title && p.id === editingId;
  return `
    <div class="card">
      <div class="field-row">
        <div class="field"><label>Title</label>
          <input id="f-title" value="${escapeHtml(p.title)}" placeholder="Paper title"></div>
        <div class="field"><label>Collaborators</label>
          <input id="f-collabs" value="${escapeHtml(p.collaborators)}" placeholder="Solo, or names"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Status</label>
          <select id="f-status">${statusOptionsHtml(p.status)}</select></div>
        <div class="field"><label>Type of project</label>
          <input id="f-type" value="${escapeHtml(p.type)}" placeholder="Standalone, dissertation chapter…"></div>
      </div>
      <div class="field"><label>Current state</label>
        <input id="f-state" value="${escapeHtml(p.state)}" placeholder="Under review at X (date), Beef up, Abstract…"></div>
      <div class="field"><label>Next steps / notes</label>
        <textarea id="f-notes" placeholder="What's next, open questions…">${escapeHtml(p.notes)}</textarea></div>
      <div class="field-row">
        <div class="field"><label>Journals sent</label>
          <input id="f-journals" value="${escapeHtml(p.journals)}" placeholder="Mind, Nous…"></div>
        <div class="field"><label>Link (Overleaf, Drive…)</label>
          <input id="f-link" value="${escapeHtml(p.link)}" placeholder="https://…"></div>
      </div>
      <div class="check-row">
        <input type="checkbox" id="f-priority" ${p.priority?'checked':''}>
        <label for="f-priority" style="margin:0">Semester priority</label>
      </div>
      <div class="form-actions">
        <button class="btn" onclick="saveEdit('${p.id}')">${isNew ? 'Add to docket' : 'Save'}</button>
        <button class="btn ghost" onclick="cancelEdit()">Cancel</button>
      </div>
    </div>
  `;
}

function syncPanelHtml(){
  const cfg = getSyncConfig();
  const connected = !!(cfg && cfg.gistId);
  const gistUrl = connected ? `https://gist.github.com/${cfg.gistId}` : '';
  const tokenUrl = 'https://github.com/settings/tokens/new?scopes=gist&description=Docket%20sync';
  return `
    <div class="sync-panel">
      <h2>${connected ? 'Sync connected' : 'Set up cross-device sync'}</h2>
      ${!connected ? `
        <p>Docket stores your data in a private GitHub Gist. Create a token scoped <strong>only to "gist"</strong>.</p>
        <p class="small"><a href="${tokenUrl}" target="_blank" rel="noopener">Create a token on GitHub →</a>
        On your first device leave "Gist ID" blank; Docket creates the gist and shows you the ID.</p>
      ` : `
        <p>Your data lives in <a href="${gistUrl}" target="_blank" rel="noopener">this private gist</a>.
        On another device, paste the same token plus this Gist ID:</p>
        <p class="small"><code>${cfg.gistId}</code></p>
      `}
      ${syncMessage ? `<div class="sync-msg ${syncState==='err'?'err':'ok'}">${escapeHtml(syncMessage)}</div>` : ''}
      ${!connected ? `
        <div class="field"><label>Personal access token</label>
          <input id="sync-token" type="password" placeholder="ghp_…"></div>
        <div class="field"><label>Gist ID (blank on first device)</label>
          <input id="sync-gistid" placeholder="optional"></div>
        <div class="form-actions">
          <button class="btn" ${syncBusy?'disabled':''} onclick="handleConnectClick()">${syncBusy?'Connecting…':'Connect'}</button>
          <button class="btn ghost" onclick="toggleSyncPanel()">Cancel</button>
        </div>
      ` : `
        <div class="form-actions">
          <button class="btn" ${syncBusy?'disabled':''} onclick="syncPull()">${syncBusy?'Syncing…':'Sync now'}</button>
          <button class="btn ghost" onclick="disconnectSync()">Disconnect this device</button>
        </div>
      `}
    </div>
  `;
}

function handleConnectClick(){
  const token = document.getElementById('sync-token').value.trim();
  const gistId = document.getElementById('sync-gistid').value.trim();
  if(!token) return;
  connectSync(token, gistId);
}
function toggleSyncPanel(){ showSyncPanel = !showSyncPanel; syncMessage=''; render(); }
function setFilter(f){ activeFilter = f; render(); }

function visibleProjects(){
  if(activeFilter === 'all') return projects;
  if(activeFilter === 'priority') return projects.filter(p => p.priority);
  if(activeFilter === 'active') return projects.filter(p => p.status !== 'published' && p.status !== 'idea');
  return projects.filter(p => (STATUS_META[p.status]||{}).stage === activeFilter);
}

function render(){
  const app = document.getElementById('app');
  const shown = visibleProjects();

  const filters = [
    ['all', `All ${projects.length}`],
    ['priority', `Semester ${projects.filter(p=>p.priority).length}`],
    ['active', 'Active'],
    ...STAGE_ORDER.map(s => [s, s])
  ];
  const filtersHtml = filters.map(([k,label]) =>
    `<button class="filter-pill ${activeFilter===k?'active':''}" onclick="setFilter('${k}')">${label}</button>`
  ).join('');

  let body = '';
  if(shown.length === 0 && !addingNew){
    body = `<div class="empty">Nothing here. Try another filter.</div>`;
  } else {
    for(const stage of STAGE_ORDER){
      const inStage = shown.filter(p => (STATUS_META[p.status]||{}).stage === stage);
      if(!inStage.length) continue;
      inStage.sort((a,b) => (b.priority?1:0) - (a.priority?1:0));
      body += `<div class="stage-head"><span>${stage}</span><span>${inStage.length}</span></div>`;
      body += inStage.map(p => p.id === editingId ? editFormHtml(p) : cardHtml(p)).join('');
    }
  }
  if(addingNew){
    body += editFormHtml({id:editingId, title:'', collaborators:'', status:'prep', state:'', notes:'', journals:'', type:'', link:'', priority:false});
  }

  const cfg = getSyncConfig();
  const connected = !!(cfg && cfg.gistId);
  const dotClass = connected ? (syncState==='err'?'err':'on') : '';
  const statusLabel = connected ? (syncState==='err'?'Sync error':'Synced via GitHub') : 'Saved in this browser only';

  app.innerHTML = `
    <header>
      <h1>Docket</h1>
      <span class="tagline">${projects.length} project${projects.length===1?'':'s'}</span>
    </header>
    <div class="meta-row">
      <span>Writing tracker</span>
      <span class="sync-status">
        <span class="sync-dot ${dotClass}"></span>
        <span>${statusLabel}</span>
        <button class="sync-btn" onclick="toggleSyncPanel()">${connected?'Manage':'Set up sync'}</button>
      </span>
    </div>
    ${showSyncPanel ? syncPanelHtml() : ''}
    <div class="filters">${filtersHtml}</div>
    ${body}
    ${addingNew ? '' : `<button class="add-toggle" onclick="startAdd()">+ Add a project</button>`}
    <div class="reset-row"><button onclick="resetAll()">Reset docket to defaults</button></div>
  `;
}

function startEdit(id){ editingId = id; addingNew = false; render(); }
function startAdd(){
  editingId = crypto.randomUUID(); addingNew = true; render();
  setTimeout(() => document.getElementById('f-title')?.focus(), 0);
}
function cancelEdit(){ editingId = null; addingNew = false; render(); }

async function togglePriority(id){
  const p = projects.find(x => x.id === id);
  if(!p) return;
  p.priority = !p.priority;
  p.updated = new Date().toISOString();
  await saveProjects();
  render();
}

async function saveEdit(id){
  const title = document.getElementById('f-title').value.trim();
  if(!title){ document.getElementById('f-title').focus(); return; }
  const data = {
    id, title,
    collaborators: document.getElementById('f-collabs').value.trim() || 'Solo',
    status: document.getElementById('f-status').value,
    type: document.getElementById('f-type').value.trim(),
    state: document.getElementById('f-state').value.trim(),
    notes: document.getElementById('f-notes').value.trim(),
    journals: document.getElementById('f-journals').value.trim(),
    link: document.getElementById('f-link').value.trim(),
    priority: document.getElementById('f-priority').checked,
    updated: new Date().toISOString()
  };
  if(addingNew){ projects.push(data); }
  else { const i = projects.findIndex(p => p.id === id); if(i > -1) projects[i] = data; }
  editingId = null; addingNew = false;
  await saveProjects();
  render();
}

async function deleteProject(id){
  projects = projects.filter(p => p.id !== id);
  await saveProjects();
  render();
}

async function resetAll(){
  projects = seed(); editingId = null; addingNew = false;
  await saveProjects();
  render();
}

loadProjects();
</script>
</body>
</html>
