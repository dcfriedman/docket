<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Docket</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --paper:#F1ECE0;
  --paper-raised:#F8F4E9;
  --ink:#20261F;
  --ink-soft:#5B5C4F;
  --rule:#C9C0AC;
  --oxblood:#7A2E2E;
  --sage:#5C6B54;
  --ochre:#A9803D;
  --slate:#41544E;
}

*{box-sizing:border-box;}

body{
  margin:0;
  background:var(--paper);
  background-image:
    repeating-linear-gradient(0deg, rgba(0,0,0,0.015) 0px, rgba(0,0,0,0.015) 1px, transparent 1px, transparent 3px);
  color:var(--ink);
  font-family:'Source Serif 4', Georgia, serif;
  min-height:100vh;
}

.wrap{
  max-width:760px;
  margin:0 auto;
  padding:48px 24px 100px;
}

header{
  border-bottom:2px solid var(--ink);
  padding-bottom:18px;
  margin-bottom:8px;
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  flex-wrap:wrap;
  gap:8px;
}

h1{
  font-size:2.1rem;
  font-weight:700;
  margin:0;
  letter-spacing:-0.01em;
}

.tagline{
  font-family:'IBM Plex Mono', monospace;
  font-size:0.72rem;
  text-transform:uppercase;
  letter-spacing:0.08em;
  color:var(--ink-soft);
}

.meta-row{
  font-family:'IBM Plex Mono', monospace;
  font-size:0.7rem;
  color:var(--ink-soft);
  display:flex;
  justify-content:space-between;
  margin:6px 0 32px;
  letter-spacing:0.02em;
}

.card{
  background:var(--paper-raised);
  border:1px solid var(--rule);
  border-left:3px solid var(--ink);
  padding:20px 22px 18px;
  margin-bottom:18px;
  position:relative;
  box-shadow:0 1px 0 rgba(0,0,0,0.03);
}

.card-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:14px;
}

.title-block{flex:1;}

.title{
  font-size:1.22rem;
  font-weight:600;
  margin:0 0 4px;
  line-height:1.3;
}

.collabs{
  font-family:'IBM Plex Mono', monospace;
  font-size:0.72rem;
  color:var(--ink-soft);
  text-transform:uppercase;
  letter-spacing:0.04em;
}

.stamp{
  font-family:'IBM Plex Mono', monospace;
  font-size:0.66rem;
  font-weight:500;
  text-transform:uppercase;
  letter-spacing:0.06em;
  padding:5px 10px;
  border:1.5px solid currentColor;
  border-radius:2px;
  transform:rotate(-2deg);
  white-space:nowrap;
  flex-shrink:0;
}

.stamp.s-strengthen{color:var(--ochre);}
.stamp.s-rewrite{color:var(--oxblood);}
.stamp.s-draft{color:var(--slate);}
.stamp.s-create{color:var(--slate);}
.stamp.s-discuss{color:var(--sage);}
.stamp.s-drafting{color:var(--sage);}
.stamp.s-review{color:var(--ochre);}
.stamp.s-submitted{color:var(--ink-soft);}
.stamp.s-done{color:var(--ink-soft); opacity:0.6;}

.notes{
  margin:12px 0 10px;
  font-size:0.95rem;
  line-height:1.55;
  color:var(--ink);
}
.notes:empty{display:none;}

.card-bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-top:1px solid var(--rule);
  padding-top:10px;
  margin-top:8px;
}

a.file-link{
  font-family:'IBM Plex Mono', monospace;
  font-size:0.75rem;
  color:var(--slate);
  text-decoration:none;
  border-bottom:1px solid var(--slate);
}
a.file-link:hover{color:var(--oxblood); border-color:var(--oxblood);}
.no-link{
  font-family:'IBM Plex Mono', monospace;
  font-size:0.75rem;
  color:var(--rule);
}

.card-actions{display:flex; gap:12px;}
.icon-btn{
  font-family:'IBM Plex Mono', monospace;
  font-size:0.7rem;
  color:var(--ink-soft);
  background:none;
  border:none;
  cursor:pointer;
  padding:2px 4px;
  text-transform:uppercase;
  letter-spacing:0.04em;
}
.icon-btn:hover{color:var(--ink); text-decoration:underline;}
.icon-btn.danger:hover{color:var(--oxblood);}

/* Edit form */
.field{margin-bottom:12px;}
.field label{
  display:block;
  font-family:'IBM Plex Mono', monospace;
  font-size:0.65rem;
  text-transform:uppercase;
  letter-spacing:0.06em;
  color:var(--ink-soft);
  margin-bottom:4px;
}
.field input, .field select, .field textarea{
  width:100%;
  font-family:'Source Serif 4', Georgia, serif;
  font-size:0.95rem;
  padding:8px 10px;
  border:1px solid var(--rule);
  background:#fff;
  color:var(--ink);
  border-radius:2px;
}
.field textarea{resize:vertical; min-height:56px; font-family:'Source Serif 4', Georgia, serif;}
.field-row{display:flex; gap:12px;}
.field-row .field{flex:1;}

.form-actions{display:flex; gap:10px; margin-top:14px;}
.btn{
  font-family:'IBM Plex Mono', monospace;
  font-size:0.72rem;
  text-transform:uppercase;
  letter-spacing:0.05em;
  padding:8px 16px;
  border:1.5px solid var(--ink);
  background:var(--ink);
  color:var(--paper-raised);
  cursor:pointer;
  border-radius:2px;
}
.btn.ghost{background:none; color:var(--ink); border-color:var(--rule);}
.btn:hover{opacity:0.85;}

.add-toggle{
  width:100%;
  text-align:left;
  background:none;
  border:1px dashed var(--rule);
  padding:14px 16px;
  font-family:'IBM Plex Mono', monospace;
  font-size:0.78rem;
  text-transform:uppercase;
  letter-spacing:0.05em;
  color:var(--ink-soft);
  cursor:pointer;
  margin-top:10px;
}
.add-toggle:hover{border-color:var(--ink); color:var(--ink);}

.empty{
  text-align:center;
  padding:60px 20px;
  color:var(--ink-soft);
  font-family:'IBM Plex Mono', monospace;
  font-size:0.8rem;
}

.loading{
  text-align:center;
  padding:80px 20px;
  color:var(--ink-soft);
  font-family:'IBM Plex Mono', monospace;
  font-size:0.75rem;
  letter-spacing:0.05em;
  text-transform:uppercase;
}

.reset-row{
  text-align:center;
  margin-top:36px;
}
.reset-row button{
  background:none;
  border:none;
  font-family:'IBM Plex Mono', monospace;
  font-size:0.65rem;
  color:var(--rule);
  text-transform:uppercase;
  letter-spacing:0.05em;
  cursor:pointer;
}
.reset-row button:hover{color:var(--oxblood);}

.sync-btn{
  font-family:'IBM Plex Mono', monospace;
  font-size:0.7rem;
  text-transform:uppercase;
  letter-spacing:0.04em;
  color:var(--slate);
  background:none;
  border:none;
  cursor:pointer;
  padding:0;
  text-decoration:underline;
}
.sync-btn:hover{color:var(--oxblood);}
.sync-status{display:flex; align-items:center; gap:10px;}
.sync-dot{
  width:7px; height:7px; border-radius:50%;
  background:var(--rule);
  display:inline-block;
}
.sync-dot.on{background:var(--sage);}
.sync-dot.err{background:var(--oxblood);}

.sync-panel{
  background:var(--paper-raised);
  border:1px solid var(--rule);
  border-left:3px solid var(--slate);
  padding:20px 22px;
  margin-bottom:18px;
}
.sync-panel h2{
  font-size:1rem;
  margin:0 0 6px;
}
.sync-panel p{
  font-size:0.85rem;
  line-height:1.55;
  color:var(--ink-soft);
  margin:0 0 14px;
}
.sync-panel p.small{font-size:0.75rem;}
.sync-panel a{color:var(--slate);}
.sync-msg{
  font-family:'IBM Plex Mono', monospace;
  font-size:0.72rem;
  padding:8px 10px;
  margin-bottom:14px;
  border:1px solid var(--rule);
}
.sync-msg.err{color:var(--oxblood); border-color:var(--oxblood);}
.sync-msg.ok{color:var(--sage); border-color:var(--sage);}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading">Opening the docket…</div>
</div>

<script>
const STATUS_META = {
  'strengthen': {label:'Needs strengthening', cls:'s-strengthen'},
  'rewrite':    {label:'Needs rewrite',       cls:'s-rewrite'},
  'to-draft':   {label:'To draft',            cls:'s-draft'},
  'to-create':  {label:'To create',           cls:'s-create'},
  'discussing': {label:'Discussing w/ collabs', cls:'s-discuss'},
  'drafting':   {label:'Drafting',            cls:'s-drafting'},
  'review':     {label:'Under review',        cls:'s-review'},
  'submitted':  {label:'Submitted',           cls:'s-submitted'},
  'done':       {label:'Done',                cls:'s-done'},
};
const STORAGE_KEY = 'docket:projects';
const SYNC_KEY = 'docket:sync-config';
const GIST_FILENAME = 'docket.json';
let projects = [];
let editingId = null;
let addingNew = false;
let showSyncPanel = false;
let syncState = 'off'; // off | ok | err
let syncMessage = '';
let syncBusy = false;

function getSyncConfig(){
  try{
    const raw = localStorage.getItem(SYNC_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}

function setSyncConfig(cfg){
  if(cfg) localStorage.setItem(SYNC_KEY, JSON.stringify(cfg));
  else localStorage.removeItem(SYNC_KEY);
}

async function ghRequest(url, options={}){
  const cfg = getSyncConfig();
  const res = await fetch(url, {
    ...options,
    headers: {
      'Authorization': `Bearer ${cfg.token}`,
      'Accept': 'application/vnd.github+json',
      ...(options.headers || {})
    }
  });
  if(!res.ok){
    const body = await res.text().catch(() => '');
    throw new Error(`GitHub API ${res.status}: ${res.statusText}${body ? ' — ' + body.slice(0,200) : ''}`);
  }
  return res.json();
}

async function connectSync(token, gistId){
  syncBusy = true;
  syncMessage = '';
  showSyncPanel = true;
  render();
  try{
    setSyncConfig({token, gistId: gistId || null});

    if(gistId){
      const gist = await ghRequest(`https://api.github.com/gists/${gistId}`);
      const file = gist.files && gist.files[GIST_FILENAME];
      if(!file) throw new Error(`Gist found, but has no ${GIST_FILENAME} file.`);
      projects = JSON.parse(file.content);
      await saveProjects();
    } else {
      const gist = await ghRequest('https://api.github.com/gists', {
        method: 'POST',
        body: JSON.stringify({
          description: 'Docket — semester writing tracker data',
          public: false,
          files: { [GIST_FILENAME]: { content: JSON.stringify(projects, null, 2) } }
        })
      });
      setSyncConfig({token, gistId: gist.id});
    }

    syncState = 'ok';
    syncMessage = 'Connected. Synced just now.';
  }catch(e){
    syncState = 'err';
    syncMessage = e.message || 'Could not connect.';
    setSyncConfig(null); // don't leave a broken config that fails silently on every future load
  }
  syncBusy = false;
  render();
}

function disconnectSync(){
  setSyncConfig(null);
  syncState = 'off';
  syncMessage = '';
  render();
}

async function syncPull(){
  const cfg = getSyncConfig();
  if(!cfg || !cfg.gistId) return;
  syncBusy = true; render();
  try{
    const gist = await ghRequest(`https://api.github.com/gists/${cfg.gistId}`);
    const file = gist.files && gist.files[GIST_FILENAME];
    if(file){
      projects = JSON.parse(file.content);
      await saveProjects(false);
    }
    syncState = 'ok';
    syncMessage = 'Synced just now.';
  }catch(e){
    syncState = 'err';
    syncMessage = e.message || 'Sync failed.';
  }
  syncBusy = false;
  render();
}

async function syncPush(){
  const cfg = getSyncConfig();
  if(!cfg || !cfg.gistId) return;
  try{
    await ghRequest(`https://api.github.com/gists/${cfg.gistId}`, {
      method: 'PATCH',
      body: JSON.stringify({
        files: { [GIST_FILENAME]: { content: JSON.stringify(projects, null, 2) } }
      })
    });
    syncState = 'ok';
    syncMessage = 'Synced just now.';
  }catch(e){
    syncState = 'err';
    syncMessage = e.message || 'Sync failed — saved locally only.';
  }
}

const seed = () => ([
  {
    id: crypto.randomUUID(),
    title: 'Defending Deliberation',
    collaborators: 'Solo',
    status: 'strengthen',
    link: '',
    notes: 'Draft exists. Needs to be beefed up — likely a depth/substance pass rather than new architecture.',
    updated: new Date().toISOString()
  },
  {
    id: crypto.randomUUID(),
    title: 'Normative Defeat',
    collaborators: 'Solo',
    status: 'rewrite',
    link: '',
    notes: 'Full rewrite, not a revision.',
    updated: new Date().toISOString()
  },
  {
    id: crypto.randomUUID(),
    title: 'Control and Understanding',
    collaborators: 'Eamon',
    status: 'to-draft',
    link: '',
    notes: 'Not yet drafted.',
    updated: new Date().toISOString()
  },
  {
    id: crypto.randomUUID(),
    title: 'Paper with Somogy',
    collaborators: 'Somogy',
    status: 'to-draft',
    link: '',
    notes: 'Not yet drafted.',
    updated: new Date().toISOString()
  },
  {
    id: crypto.randomUUID(),
    title: 'End of Action',
    collaborators: 'Solo',
    status: 'to-create',
    link: '',
    notes: 'Earlier than a draft — needs to be conceived/outlined first.',
    updated: new Date().toISOString()
  },
  {
    id: crypto.randomUUID(),
    title: 'Paper with Will & Dunja',
    collaborators: 'Will, Dunja',
    status: 'discussing',
    link: '',
    notes: 'About to discuss next steps with them.',
    updated: new Date().toISOString()
  },
]);

async function loadProjects(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    projects = raw ? JSON.parse(raw) : seed();
    if(!raw) await saveProjects(false);
  }catch(e){
    projects = seed();
    await saveProjects(false);
  }

  const cfg = getSyncConfig();
  if(cfg && cfg.gistId){
    render(); // show local data immediately, then refresh from gist
    await syncPull();
    return;
  }
  render();
}

async function saveProjects(pushToGist = true){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(projects));
  }catch(e){
    console.error('Save failed', e);
  }
  const cfg = getSyncConfig();
  if(pushToGist && cfg && cfg.gistId){
    await syncPush();
  }
}

function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function statusOptionsHtml(selected){
  return Object.entries(STATUS_META).map(([k,v]) =>
    `<option value="${k}" ${k===selected?'selected':''}>${v.label}</option>`
  ).join('');
}

function cardHtml(p){
  const meta = STATUS_META[p.status] || STATUS_META['to-draft'];
  const linkHtml = p.link
    ? `<a class="file-link" href="${escapeHtml(p.link)}" target="_blank" rel="noopener">→ ${escapeHtml(p.link.replace(/^https?:\/\//,''))}</a>`
    : `<span class="no-link">No file linked</span>`;
  return `
    <div class="card">
      <div class="card-top">
        <div class="title-block">
          <p class="title">${escapeHtml(p.title)}</p>
          <p class="collabs">${escapeHtml(p.collaborators || 'Solo')}</p>
        </div>
        <span class="stamp ${meta.cls}">${meta.label}</span>
      </div>
      <p class="notes">${escapeHtml(p.notes)}</p>
      <div class="card-bottom">
        ${linkHtml}
        <div class="card-actions">
          <button class="icon-btn" onclick="startEdit('${p.id}')">Edit</button>
          <button class="icon-btn danger" onclick="deleteProject('${p.id}')">Remove</button>
        </div>
      </div>
    </div>
  `;
}

function editFormHtml(p){
  const isNew = !p.title && p.id === editingId;
  return `
    <div class="card">
      <div class="field-row">
        <div class="field">
          <label>Title</label>
          <input id="f-title" value="${escapeHtml(p.title)}" placeholder="Paper title">
        </div>
        <div class="field">
          <label>Collaborators</label>
          <input id="f-collabs" value="${escapeHtml(p.collaborators)}" placeholder="Solo, or names">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Status</label>
          <select id="f-status">${statusOptionsHtml(p.status)}</select>
        </div>
        <div class="field">
          <label>Link (Overleaf, Drive, etc.)</label>
          <input id="f-link" value="${escapeHtml(p.link)}" placeholder="https://overleaf.com/...">
        </div>
      </div>
      <div class="field">
        <label>Plans / notes</label>
        <textarea id="f-notes" placeholder="What's next, what you discussed, open questions...">${escapeHtml(p.notes)}</textarea>
      </div>
      <div class="form-actions">
        <button class="btn" onclick="saveEdit('${p.id}')">${isNew ? 'Add to docket' : 'Save'}</button>
        <button class="btn ghost" onclick="cancelEdit('${p.id}')">Cancel</button>
      </div>
    </div>
  `;
}

function syncPanelHtml(){
  const cfg = getSyncConfig();
  const connected = !!(cfg && cfg.gistId);
  const gistUrl = connected ? `https://gist.github.com/${cfg.gistId}` : '';
  const tokenUrl = 'https://github.com/settings/tokens/new?scopes=gist&description=Docket%20sync';

  return `
    <div class="sync-panel">
      <h2>${connected ? 'Sync connected' : 'Set up cross-device sync'}</h2>
      ${!connected ? `
        <p>Docket will store your data in a private GitHub Gist. Create a personal access token scoped
        <strong>only to "gist"</strong> — it can't touch your repos or anything else.</p>
        <p class="small"><a href="${tokenUrl}" target="_blank" rel="noopener">Create a token on GitHub →</a>
        Then paste it below. On your first device, leave "Gist ID" blank — Docket will create the gist and
        show you the ID to reuse on other devices.</p>
      ` : `
        <p>Your data lives in <a href="${gistUrl}" target="_blank" rel="noopener">this private gist</a>.
        On another device, paste the same token and this Gist ID:</p>
        <p class="small"><code>${cfg.gistId}</code></p>
      `}
      ${syncMessage ? `<div class="sync-msg ${syncState==='err'?'err':'ok'}">${escapeHtml(syncMessage)}</div>` : ''}
      ${!connected ? `
        <div class="field">
          <label>Personal access token</label>
          <input id="sync-token" type="password" placeholder="ghp_...">
        </div>
        <div class="field">
          <label>Gist ID (leave blank on first device)</label>
          <input id="sync-gistid" placeholder="optional">
        </div>
        <div class="form-actions">
          <button class="btn" ${syncBusy?'disabled':''} onclick="handleConnectClick()">${syncBusy ? 'Connecting…' : 'Connect'}</button>
          <button class="btn ghost" onclick="toggleSyncPanel()">Cancel</button>
        </div>
      ` : `
        <div class="form-actions">
          <button class="btn" ${syncBusy?'disabled':''} onclick="syncPull().then(render)">${syncBusy ? 'Syncing…' : 'Sync now'}</button>
          <button class="btn ghost" onclick="disconnectSync()">Disconnect this device</button>
        </div>
      `}
    </div>
  `;
}

function handleConnectClick(){
  const token = document.getElementById('sync-token').value.trim();
  const gistId = document.getElementById('sync-gistid').value.trim();
  if(!token) return;
  connectSync(token, gistId);
}

function toggleSyncPanel(){
  showSyncPanel = !showSyncPanel;
  syncMessage = '';
  render();
}

function render(){
  const app = document.getElementById('app');
  const sorted = [...projects];
  let cardsHtml = '';

  if(sorted.length === 0 && !addingNew){
    cardsHtml = `<div class="empty">The docket is empty. Add a project below.</div>`;
  } else {
    cardsHtml = sorted.map(p =>
      p.id === editingId ? editFormHtml(p) : cardHtml(p)
    ).join('');
  }

  if(addingNew){
    cardsHtml += editFormHtml({id: editingId, title:'', collaborators:'', status:'to-draft', link:'', notes:''});
  }

  const addButtonHtml = addingNew ? '' : `<button class="add-toggle" onclick="startAdd()">+ Add a project</button>`;

  const cfg = getSyncConfig();
  const connected = !!(cfg && cfg.gistId);
  const dotClass = connected ? (syncState === 'err' ? 'err' : 'on') : '';
  const statusLabel = connected ? (syncState === 'err' ? 'Sync error' : 'Synced via GitHub') : 'Saved in this browser only';

  app.innerHTML = `
    <header>
      <h1>Docket</h1>
      <span class="tagline">${projects.length} open matter${projects.length===1?'':'s'}</span>
    </header>
    <div class="meta-row">
      <span>Semester writing tracker</span>
      <span class="sync-status">
        <span class="sync-dot ${dotClass}"></span>
        <span>${statusLabel}</span>
        <button class="sync-btn" onclick="toggleSyncPanel()">${connected ? 'Manage' : 'Set up sync'}</button>
      </span>
    </div>
    ${showSyncPanel ? syncPanelHtml() : ''}
    ${cardsHtml}
    ${addButtonHtml}
    <div class="reset-row">
      <button onclick="resetAll()">Reset docket to defaults</button>
    </div>
  `;
}

function startEdit(id){
  editingId = id;
  addingNew = false;
  render();
}

function startAdd(){
  editingId = crypto.randomUUID();
  addingNew = true;
  render();
  setTimeout(() => document.getElementById('f-title')?.focus(), 0);
}

function cancelEdit(id){
  editingId = null;
  addingNew = false;
  render();
}

async function saveEdit(id){
  const title = document.getElementById('f-title').value.trim();
  if(!title){
    document.getElementById('f-title').focus();
    return;
  }
  const data = {
    id,
    title,
    collaborators: document.getElementById('f-collabs').value.trim() || 'Solo',
    status: document.getElementById('f-status').value,
    link: document.getElementById('f-link').value.trim(),
    notes: document.getElementById('f-notes').value.trim(),
    updated: new Date().toISOString()
  };

  if(addingNew){
    projects.push(data);
  } else {
    const idx = projects.findIndex(p => p.id === id);
    if(idx > -1) projects[idx] = data;
  }

  editingId = null;
  addingNew = false;
  await saveProjects();
  render();
}

async function deleteProject(id){
  projects = projects.filter(p => p.id !== id);
  await saveProjects();
  render();
}

async function resetAll(){
  projects = seed();
  editingId = null;
  addingNew = false;
  await saveProjects();
  render();
}

loadProjects();
</script>
</body>
</html>
